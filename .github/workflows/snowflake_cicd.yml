
name: Deploy Streamlit to Snowflake

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Streamlit using DCM - DEV
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Snowflake CLI with DCM support
      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          pip install "snowflake-cli>=3.24.0"

      # 4. Configure Snowflake connection
      - name: Configure Snowflake
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
        run: |
          # Validate required credentials
          if [ -z "$SF_ACCOUNT" ]; then
            echo "::error::SF_ACCOUNT secret is missing"
            exit 1
          fi

          if [ -z "$SF_USER" ]; then
            echo "::error::SF_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$SF_PASSWORD" ]; then
            echo "::error::SF_PASSWORD secret is missing"
            exit 1
          fi

          mkdir -p ~/.snowflake

          cat > ~/.snowflake/config.toml <<EOF
          [connections.demo]
          account = "$SF_ACCOUNT"
          user = "$SF_USER"
          password = "$SF_PASSWORD"
          warehouse = "$SF_WAREHOUSE"
          role = "$SF_ROLE"
          EOF

          chmod 0600 ~/.snowflake/config.toml

      # 5. Test Snowflake connection
      - name: Test Snowflake connection
        run: |
          snow connection test --connection demo

      # 6. Validate DCM project definition
      - name: DCM Plan - DEV
        run: |
          snow dcm plan \
            --target DEV \
            --connection demo \
            --save-output

      # 7. Deploy Streamlit application to DEV
      - name: DCM Deploy - DEV
        run: |
          snow dcm deploy \
            --target DEV \
            --connection demo \
            --save-output
